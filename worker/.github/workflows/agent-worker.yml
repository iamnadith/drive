name: Agent Worker
run-name: >-
  Agent Worker / ${{
    inputs.repair_job_id ||
    github.event.client_payload.repair_job_id ||
    github.run_id
  }}

on:
  workflow_dispatch:
    inputs:
      migration_id:
        description: Migration id to process
        required: false
      repair_job_id:
        description: Repair job id queued by the website
        required: false
      agent_id:
        description: Agent id requesting dispatch
        required: false
      server_url:
        description: Drive server URL
        required: false
      agent_token:
        description: Agent registration token
        required: false
  repository_dispatch:
    types: [drive-agent-worker]

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run agent worker
        env:
          SERVER_URL: ${{ inputs.server_url || github.event.client_payload.server_url || vars.DRIVE_SERVER_URL || secrets.DRIVE_SERVER_URL }}
          AGENT_ID: ${{ inputs.agent_id || github.event.client_payload.agent_id || vars.DRIVE_AGENT_ID || secrets.DRIVE_AGENT_ID }}
          TOKEN: ${{ inputs.agent_token || github.event.client_payload.agent_token || secrets.DRIVE_AGENT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POLL_MS: "15000"
          HEARTBEAT_MS: "20000"
        run: npm start
